<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form Page</title>

        <style>
        #form-container {
            display: flex;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(0, 149, 120);
            margin: 0;
            padding: 0;
        }
       #login {
        background-color: white;
            width: 300px;
            height: 300px;
            margin: 150px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #signup {
            background-color: white;
            width: 300px;
            height: 350px;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: rgb(0, 149, 120);
        }
        #username {
            width: 90%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        #password {
            width: 90%;
            padding: 10px;
            margin-top: -30px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: rgb(0, 149, 120);
            color: white;
            border: none;
            border-radius: 3px;
        }
        input[type="submit"]:hover {
            background-color: rgb(0, 120, 97);
        }
        p {
            text-align: center;
            font-family: sans-serif;
        }
        #forgot {
            margin-top: 1px;
            text-align: left;
            /* padding-right: 10%; */
            color: rgb(0, 149, 120);
        }
        span {
            color: rgb(0, 149, 120);
            cursor: pointer;
        }
        span:hover {
            text-decoration: underline;
        }
        #login-options {
            padding-top: -50%;
            text-align: center;
        }
        #new-username {
            width: 90%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        #create-password {
            width: 90%;
            padding: 10px;
            margin-top: -30px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        #confirm-password {
            width: 90%;
            padding: 10px;
            margin-top: -30px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        #login:hover, #signup:hover {
            box-shadow: 0 0 15px rgba(0, 0, 0, 5);
        }

        </style>
    </head>

    <body>
        <div id="form-container">
            <div id="login">
                <h2>Login</h2>
                <form>
                    <label for="username"></label><br>
                    <input type="text" id="username" name="username" placeholder="Enter your email"><br><br>
                    <label for="password"></label><br>
                    <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
                    <div id="login-options">
                        <p id="forgot">Forgot password?</p>
                    <input type="submit" value="Login">
                    <p>Don't have an account?<span>Signup</span></p>
                    </div>
                </form>
                
        </div>

        <div id="signup">
            <h2>Sign Up</h2>
            <form>
                <label for="new-username"></label><br>
                <input type="text" id="new-username" name="new-username" placeholder="Enter your email"><br><br>
                <label for="create-password"></label><br>
                <input type="email" id="create-password" name="create-password" placeholder="Create a password"><br><br>
                <label for="confirm-password"></label><br>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"><br><br>
                <input type="submit" value="Sign Up">
                <p>Already have an account? <span>Login</span></p>
            </form>
        </div>
    </div>
        
    </body>
</html>
