<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slayder</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; }

    .slider {
      position: relative;
      max-width: 800px;
      margin: 50px auto;
      overflow: hidden;
      border-radius: 10px;
    }

    .slides img {
      width: 100%;
      display: none;
      transition: opacity 0.5s ease;
    }

    .slide.active {
      display: block;
      opacity: 1;
    }

    /* Tugmalar */
    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      font-size: 24px;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    /* Nuqtachalar */
    .dots {
      text-align: center;
      margin-top: 10px;
    }

    .dot {
      height: 12px;
      width: 12px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
    }

    .dot.active {
      background-color: #333;
    }
  </style>
</head>
<body>

  <div class="slider">
    <div class="slides">
      <img src="https://picsum.photos/id/1015/800/400" class="slide active">
      <img src="https://picsum.photos/id/1024/800/400" class="slide">
      <img src="https://picsum.photos/id/1035/800/400" class="slide">
    </div>

    <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="next" onclick="changeSlide(1)">&#10095;</button>

    <div class="dots">
      <span class="dot active" onclick="currentSlide(0)"></span>
      <span class="dot" onclick="currentSlide(1)"></span>
      <span class="dot" onclick="currentSlide(2)"></span>
    </div>
  </div>

  <script>
    let currentIndex = 0;
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');

    function showSlide(index) {
      if (index >= slides.length) currentIndex = 0;
      else if (index < 0) currentIndex = slides.length - 1;
      else currentIndex = index;

      slides.forEach((s, i) => s.classList.toggle('active', i === currentIndex));
      dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
    }

    function changeSlide(n) {
      showSlide(currentIndex + n);
    }

    function currentSlide(n) {
      showSlide(n);
    }

    // Avtomatik aylanish (har 4 soniyada)
    setInterval(() => {
      changeSlide(1);
    }, 4000);
  </script>

</body>
</html>
